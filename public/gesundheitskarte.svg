<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8d8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b0c4d8;stop-opacity:1" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="856" height="540" rx="32" ry="32"/>
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect width="856" height="540" rx="32" ry="32" fill="url(#cardBg)"/>

  <!-- === VITRUVIAN MAN CIRCLE (left side) === -->
  <g clip-path="url(#cardClip)" opacity="0.55">
    <!-- Outer circle -->
    <circle cx="245" cy="300" r="195" fill="none" stroke="#3a6a9a" stroke-width="1.8"/>
    <!-- Square -->
    <rect x="90" y="145" width="312" height="312" fill="none" stroke="#3a6a9a" stroke-width="1.4"/>
    <!-- Inner detail circle -->
    <circle cx="245" cy="300" r="160" fill="none" stroke="#3a6a9a" stroke-width="0.8"/>

    <!-- Figure - body torso -->
    <line x1="245" y1="195" x2="245" y2="350" stroke="#3a6a9a" stroke-width="2.2"/>
    <!-- Shoulders line -->
    <line x1="185" y1="230" x2="305" y2="230" stroke="#3a6a9a" stroke-width="1.6"/>
    <!-- Hips line -->
    <line x1="200" y1="350" x2="290" y2="350" stroke="#3a6a9a" stroke-width="1.6"/>

    <!-- Arms spread out (outer position) -->
    <line x1="68" y1="230" x2="185" y2="230" stroke="#3a6a9a" stroke-width="1.4"/>
    <line x1="305" y1="230" x2="422" y2="230" stroke="#3a6a9a" stroke-width="1.4"/>
    <!-- Arms raised (inner position connecting to circle) -->
    <line x1="100" y1="145" x2="185" y2="230" stroke="#3a6a9a" stroke-width="1.2"/>
    <line x1="305" y1="230" x2="390" y2="145" stroke="#3a6a9a" stroke-width="1.2"/>

    <!-- Legs spread (outer position) -->
    <line x1="200" y1="350" x2="130" y2="457" stroke="#3a6a9a" stroke-width="1.4"/>
    <line x1="290" y1="350" x2="360" y2="457" stroke="#3a6a9a" stroke-width="1.4"/>
    <!-- Legs together (inner position) -->
    <line x1="225" y1="350" x2="210" y2="440" stroke="#3a6a9a" stroke-width="1.2"/>
    <line x1="265" y1="350" x2="280" y2="440" stroke="#3a6a9a" stroke-width="1.2"/>

    <!-- Head -->
    <circle cx="245" cy="185" r="24" fill="none" stroke="#3a6a9a" stroke-width="1.8"/>
    <!-- Hair lines -->
    <path d="M222 172 Q245 158 268 172" fill="none" stroke="#3a6a9a" stroke-width="1.2"/>

    <!-- Horizontal reference lines -->
    <line x1="68" y1="230" x2="422" y2="230" stroke="#3a6a9a" stroke-width="0.7" opacity="0.5"/>
    <line x1="68" y1="350" x2="422" y2="350" stroke="#3a6a9a" stroke-width="0.7" opacity="0.5"/>
  </g>

  <!-- === NFC CHIP (on top of vitruvian man area) === -->
  <g>
    <!-- Chip body -->
    <rect x="154" y="266" width="110" height="88" rx="12" ry="12" fill="#c8a020"/>
    <rect x="160" y="272" width="98" height="76" rx="9" ry="9" fill="#d4ac2a"/>
    <!-- Chip grid lines -->
    <line x1="200" y1="272" x2="200" y2="348" stroke="#a07818" stroke-width="1.8"/>
    <line x1="220" y1="272" x2="220" y2="348" stroke="#a07818" stroke-width="1.8"/>
    <line x1="160" y1="305" x2="258" y2="305" stroke="#a07818" stroke-width="1.8"/>
    <!-- Chip contact pads (6 pads in 2x3 grid) -->
    <rect x="168" y="278" width="24" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <rect x="200" y="278" width="24" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <rect x="228" y="278" width="22" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <rect x="168" y="310" width="24" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <rect x="200" y="310" width="24" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <rect x="228" y="310" width="22" height="20" rx="3" fill="#b89018" opacity="0.7"/>
    <!-- NFC symbol on chip -->
    <path d="M238 336 Q248 328 248 310 Q248 292 238 284" fill="none" stroke="#906810" stroke-width="1.4"/>
    <path d="M242 338 Q255 328 255 310 Q255 292 242 282" fill="none" stroke="#906810" stroke-width="1"/>
  </g>

  <!-- === RIGHT SIDE: HEADER === -->
  <!-- "Gesundheitskarte" title -->
  <text x="490" y="68" font-family="Arial Black, Arial, sans-serif" font-size="46" font-weight="900" fill="#0a0a0a" letter-spacing="-1">Gesundheitskarte</text>

  <!-- German flag stripe -->
  <rect x="490" y="82" width="320" height="14" rx="3" fill="#1a1a1a"/>
  <rect x="490" y="96" width="320" height="14" rx="3" fill="#cc0000"/>
  <rect x="490" y="110" width="320" height="14" rx="3" fill="#ffcc00"/>

  <!-- Card number -->
  <text x="490" y="148" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0a0a0a" letter-spacing="3">123456</text>

  <!-- === PHOTO AREA (top right) === -->
  <rect x="656" y="170" width="148" height="188" rx="8" ry="8" fill="#e8eef5" stroke="#a0b8cc" stroke-width="1.5"/>
  <!-- Avatar figure inside photo -->
  <circle cx="730" cy="230" r="34" fill="#90a8c0"/>
  <ellipse cx="730" cy="315" rx="52" ry="38" fill="#90a8c0"/>
  <!-- Face details -->
  <circle cx="718" cy="226" r="6" fill="#f5e8d8" opacity="0.7"/>
  <circle cx="742" cy="226" r="6" fill="#f5e8d8" opacity="0.7"/>
  <path d="M718 242 Q730 252 742 242" fill="none" stroke="#f5e8d8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- === BOTTOM TEXT LINES === -->
  <rect x="58" y="476" width="160" height="12" rx="6" fill="#8899aa" opacity="0.5"/>
  <rect x="58" y="496" width="110" height="10" rx="5" fill="#8899aa" opacity="0.35"/>
  <rect x="310" y="476" width="180" height="12" rx="6" fill="#8899aa" opacity="0.5"/>
  <rect x="310" y="496" width="130" height="10" rx="5" fill="#8899aa" opacity="0.35"/>

  <!-- === BRAILLE DOTS (bottom right) === -->
  <g fill="#7090a8" opacity="0.75">
    <!-- Row 1 of dots -->
    <circle cx="680" cy="478" r="5"/>
    <circle cx="700" cy="478" r="5"/>
    <circle cx="720" cy="478" r="5"/>
    <circle cx="740" cy="478" r="5"/>
    <!-- Row 2 -->
    <circle cx="680" cy="498" r="5"/>
    <circle cx="700" cy="498" r="5"/>
    <circle cx="720" cy="498" r="5"/>
    <!-- Row 3 -->
    <circle cx="700" cy="518" r="5"/>
  </g>
</svg>
